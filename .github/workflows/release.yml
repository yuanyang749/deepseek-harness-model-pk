name: release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish built packages to npm
        type: boolean
        default: false
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin
            arch: arm64
          - runner: macos-15-intel
            platform: darwin
            arch: x64
          - runner: windows-2025
            platform: win32
            arch: x64
          - runner: windows-11-arm
            platform: win32
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:native
      - run: pnpm --dir packages/native-${{ matrix.platform }}-${{ matrix.arch }} pack --pack-destination ../../dist/packages
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/packages/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push' || inputs.publish
    needs: native-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          path: dist/packages
      - name: Publish native packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(dist/packages/native-*/*.tgz)
          if [ ${#packages[@]} -eq 0 ]; then
            echo 'no native tarballs found' >&2
            exit 1
          fi
          for tarball in "${packages[@]}"; do
            echo "publishing ${tarball}"
            if output="$(npm publish "${tarball}" --access public 2>&1)"; then
              printf '%s\n' "${output}"
              continue
            fi
            printf '%s\n' "${output}"
            if printf '%s' "${output}" | grep -qiE 'cannot publish over|already exists|EPUBLISHCONFLICT'; then
              echo "already published; skipping ${tarball}"
              continue
            fi
            exit 1
          done
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Publish main package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "main package already published; skipping"
          else
            pnpm publish --access public --no-git-checks
          fi
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          tag="${GITHUB_REF_NAME}"
          notes="Published ${tag} to npm: @yuanyang749/dsh-model-pk and four platform native helpers."
          gh release create "${tag}" dist/packages/native-*/*.tgz --title "${tag}" --notes "${notes}" --latest
